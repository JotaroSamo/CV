<div class="contact-widget" [class.open]="isOpen()">
  <button class="fab" (click)="toggle()" [attr.aria-expanded]="isOpen()">
    @if (isOpen()) { ✖ } @else { 💬 }
  </button>

  <div class="panel">
    <div class="panel-header">{{ t().contact_widget_title }}</div>
    <div class="panel-body">
      <input class="input" [value]="contact()" (input)="contact.set($any($event.target).value)" [placeholder]="t().contact_placeholder" />
      <textarea class="textarea" [value]="message()" (input)="message.set($any($event.target).value)" [placeholder]="t().message_placeholder"></textarea>
      <button class="send" (click)="send()" [disabled]="isSending()">{{ isSending() ? t().sending : t().send }}</button>
      @if (success()) { <div class="success">{{ success() }}</div> }
      @if (error()) { <div class="error">{{ error() }}</div> }
    </div>
  </div>
</div>
