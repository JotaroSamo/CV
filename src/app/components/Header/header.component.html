<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo/Name Section -->
      <div class="logo">
        <h1 class="name"><a href="/" (click)="goHome($event)">{{ name()}}</a></h1>
      </div>
      
      <div class="right-side">
        <!-- Navigation -->
        <nav class="navigation">
          
          <ul class="nav-list">
            @for (item of navigationItems(); track item.href) {
              <li class="nav-item">
                <a [href]="item.href" class="nav-link">
                  <span class="nav-text">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </nav>
        
        <!-- Controls -->
        <div class="header-controls">
          <!-- Language Toggle Button -->
          <div class="language-toggle">
            <button 
              class="language-button" 
              (click)="toggleLanguage()"
              [attr.aria-label]="isRussian() ? 'Switch to English' : 'Переключить на русский'"
              title="{{ isRussian() ? 'Switch to English' : 'Переключить на русский' }}">
              <div class="language-text">
                {{ isRussian() ? 'EN' : 'RU' }}
              </div>
            </button>
          </div>

          <!-- Theme Toggle Button -->
          <div class="theme-toggle">
            <button 
              class="theme-button" 
              (click)="toggleTheme()"
              [attr.aria-label]="isDarkTheme() ? 'Переключить на светлую тему' : 'Переключить на темную тему'"
              title="{{ isDarkTheme() ? 'Переключить на светлую тему' : 'Переключить на темную тему' }}">
              <div class="theme-icon">
                @if (isDarkTheme()) {
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3V4M12 20V21M4 12H3M6.31412 6.31412L5.5 5.5M17.6859 6.31412L18.5 5.5M6.31412 17.69L5.5 18.5041M17.6859 17.69L18.5 18.5041M21 12H20M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                }
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
