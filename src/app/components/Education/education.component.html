<section id="education" class="education-section">
  <div class="container">
    <div class="education-content">
      <!-- Заголовок секции -->
      <div class="section-header">
        <h2 class="section-title">{{ t().education_title }}</h2>
        <mat-divider class="section-divider"></mat-divider>
      </div>

      <!-- Основное образование -->
      <div class="education-timeline">
        @for (education of educationItems(); track education.institution) {
          <mat-card class="education-card">
            <mat-card-content>
              <div class="education-content">
                <div class="education-header">
                  <div class="institution-info">
                    <h3 class="institution-name">{{ education.institution }}</h3>
                    <h4 class="degree-title">{{ education.degree }}</h4>
                    <div class="period-gpa">
                      <span class="period">{{ education.period }}</span>
                      <span class="gpa">{{ t().gpa }} {{ education.gpa }}</span>
                    </div>
                  </div>
                  <div class="education-icon">
                    <mat-icon>school</mat-icon>
                  </div>
                </div>
                
                <p class="education-description">{{ education.description }}</p>
              
              </div>
            </mat-card-content>
          </mat-card>
        }
      </div>

    </div>
  </div>
</section>
