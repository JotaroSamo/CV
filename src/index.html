<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anton Samoshuk</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Apply theme before first paint to avoid flash
    (function() {
      try {
        var STORAGE_KEY = 'cv-theme-mode';
        var saved = localStorage.getItem(STORAGE_KEY);
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');

        var docEl = document.documentElement; // <html>
        var body = document.body;

        docEl.setAttribute('data-theme', theme);
        docEl.classList.remove(theme === 'dark' ? 'light-theme' : 'dark-theme');
        docEl.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
        docEl.style.colorScheme = theme;

        // In case global styles target body
        if (body) {
          body.classList.remove(theme === 'dark' ? 'light-theme' : 'dark-theme');
          body.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
          body.style.colorScheme = theme;
        }
      } catch (e) {
        // noop
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
